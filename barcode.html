<!DOCTYPE html>
<html>
<head>
  <title>Barcode Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
  <style>
    #reader { width: 100%; height: 300px; margin: 20px auto; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h3 style="text-align:center;">Barcode Scanner</h3>
  <div id="reader"></div>
  <div id="result">Waiting for barcode scan...</div>

  <script>
    Quagga.init({
      inputStream: {
        type: "LiveStream",
        constraints: {
          facingMode: "environment"
        }
      },
      decoder: {
        readers: ["code_128_reader", "ean_reader", "ean_8_reader", "upc_reader", "upc_e_reader"]
      }
    }, function(err) {
      if (err) {
        console.log(err);
        return;
      }
      Quagga.start();
    });

    Quagga.onDetected(function(result) {
      document.getElementById("result").innerText = `Scanned Barcode: ${result.codeResult.code}`;
      Quagga.stop();
    });
  </script>
</body>
</html>
