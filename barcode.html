<!DOCTYPE html>
<html>
<head>
  <title>Simple Barcode Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/dist/html5-qrcode.min.js"></script>

  <style>
    #reader {
      width: 300px;
      margin: 20px auto;
    }
    #result {
      text-align: center;
      font-size: 18px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h3 style="text-align:center;">Simple Barcode Scanner</h3>
  <div id="reader"></div>
  <div id="result">Waiting for scan...</div>

  <script>
    const formats = Html5Qrcode.SUPPORTED_FORMATS;
    const html5QrCode = new Html5Qrcode("reader");
console.log(Html5Qrcode);

    html5QrCode.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 300, height: 100 },
        formatsToSupport: [
          formats.CODE_128,
          formats.EAN_13,
          formats.UPC_A
        ]
      },
      (decodedText) => {
        document.getElementById("result").innerText = `Scanned: ${decodedText}`;
        html5QrCode.stop(); // stop after one scan
      },
      (errorMessage) => {
        // Optional: ignore scan errors
      }
    );
  </script>
</body>
</html>
