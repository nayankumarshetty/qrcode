<!DOCTYPE html>
<html>
<head>
  <title>Barcode Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
  <style>
    #reader { width: 200px; height: 100px; margin: 10px auto; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h3 style="text-align:center;">Barcode Scanner</h3>
  <div id="reader"></div>
  <div id="result">Waiting for barcode scan...</div>

  <script>
    // Initialize QuaggaJS for live streaming
    Quagga.init({
      inputStream: {
        type: "LiveStream",
        constraints: {
          facingMode: "environment"  // Use the back camera on mobile devices
        },
        target: document.querySelector('#reader')  // Target div for live video
      },
      decoder: {
        readers: ["code_128_reader", "ean_reader", "ean_8_reader", "upc_reader", "upc_e_reader"] // Supported formats
      }
    }, function(err) {
      if (err) {
        console.log(err);
        return;
      }
      Quagga.start();  // Start the scanner
    });

    // Event handler for barcode detection
    Quagga.onDetected(function(result) {
      document.getElementById("result").innerText = `Scanned Barcode: ${result.codeResult.code}`;
      Quagga.stop();  // Stop after one scan
    });
  </script>
</body>
</html>
