<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Barcode Scanner</title>
  <style>
    #reader {
      width: 100%;
      height: 300px;
      margin: 0 auto;
    }
    #result {
      font-size: 1.2rem;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Barcode Scanner</h2>
  <div id="reader"></div>
  <div id="result">Waiting for barcode...</div>

  <!-- ✅ Make sure this version is used -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>
  
  <script>
    window.addEventListener("load", () => {
      const formatsToSupport = [
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.UPC_A
      ];

      const config = {
        fps: 10,
        qrbox: { width: 300, height: 100 },
        formatsToSupport: formatsToSupport,
        supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
      };

      const html5QrcodeScanner = new Html5QrcodeScanner("reader", config, false);

      html5QrcodeScanner.render(
        (decodedText, decodedResult) => {
          document.getElementById("result").innerText = `Scanned: ${decodedText}`;
        },
        (error) => {
          // Optional: comment this out to reduce noise
          console.warn("Scan error:", error);
        }
      );
    });
  </script>
</body>
</html>
