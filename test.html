<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Scanner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    #reader {
      width: 100%;
      height: 400px;
      margin: 20px 0;
    }
    #qr-result {
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>QR Code Scanner</h1>
  <p>Scan a QR code to see the result below.</p>

  <div id="reader"></div>
  
  <div id="qr-result">
    <p id="result-text">No QR code scanned yet.</p>
  </div>

  <!-- Corrected script source for html5-qrcode -->
 // <script src="https://cdn.jsdelivr.net/npm/html5-qrcode/minified/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@latest/minified/html5-qrcode.min.js"></script>

  <script>
    // Ensure the library is loaded before using it
    if (typeof Html5QrcodeScanner === 'undefined') {
      console.error("Html5QrcodeScanner is not defined. Please check the script URL.");
    } else if (typeof Html5QrcodeScanner === 'undefined') {
    console.error("Html5QrcodeScanner is not defined. Please check the script URL.");
  } else {
      // Initialize the QR Code scanner
      const qrCodeScanner = new Html5QrcodeScanner(
        "reader", {
          fps: 10, 
          qrbox: 250
        });

      // Start scanning
      qrCodeScanner.render(
        (decodedText) => {
          // Show the result when a QR code is decoded
          document.getElementById("result-text").innerText = decodedText;
        },
        (errorMessage) => {
          // Handle errors (if necessary)
          console.error(errorMessage);
        }
      );
    }

  </script>
</body>
</html>
